<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - NovaCloud</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header>

    <div class="logo">
        NovaCloud
    </div>

    <a href="{{ url_for('logout') }}">
        Logout
    </a>

</header>


<main class="dashboard">

    <p class="subtitle">
        DASHBOARD
    </p>

    <h1>
        Welcome, {{ username }}
    </h1>

    <p class="description">
        You are successfully logged in to NovaCloud.
    </p>


    <div class="cards">

        <div class="card">

            <h2>
                Cloud Storage
            </h2>

            <p>
                10 GB available
            </p>

        </div>


        <div class="card">

            <h2>
                Account
            </h2>

            <p>
                Active
            </p>

        </div>


        <div class="card">

            <h2>
                Security
            </h2>

            <p>
                Password protected
            </p>

        </div>

    </div>

</main>

</body>
</html>
